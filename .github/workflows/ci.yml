name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LINUX_LIBRARIES: libsqlite3-dev libssl-dev pkg-config
  MDBOOK: https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
  STYLUA: https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
  LUACHECK: 1.2.0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y $LINUX_LIBRARIES
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  ast-grep:
    name: ast-grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global @ast-grep/cli@0.45.3
      - run: ast-grep scan crates/kernel/src crates/uji/src

  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install StyLua
        run: |
          curl -sSLo "$RUNNER_TEMP/stylua.zip" "$STYLUA"
          unzip -q "$RUNNER_TEMP/stylua.zip" -d /usr/local/bin
      - run: stylua --check lua/uji crates/kernel/src crates/tests/lua

  luacheck:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: |
          sudo apt-get update && sudo apt-get install -y luarocks
          sudo luarocks install luacheck "$LUACHECK"
      - run: luacheck lua/uji crates/kernel/src crates/tests/lua

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y $LINUX_LIBRARIES
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p uji-tests --bin uji-test -- -l crates/tests/lua/main.lua

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: curl -sSL "$MDBOOK" | tar -xz -C /usr/local/bin
      - run: mdbook build docs

  ci:
    name: ci
    if: always()
    needs: [fmt, clippy, ast-grep, stylua, luacheck, test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            test "$result" = success
          done
