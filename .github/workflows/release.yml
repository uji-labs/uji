name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag

  binaries:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup where the runner has none
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - run: rustup toolchain install
      - run: cargo build --release --locked --package uji
      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: uji-${{ matrix.target }}.tar.gz
        run: |
          tar -czf "$ARCHIVE" -C target/release uji
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  formula:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: uji-labs/homebrew-uji
          token: ${{ secrets.PACKAGE_TOKEN }}
          path: tap

      - name: Point the formula at the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.sha256" --dir sums
          sum() { cut -d ' ' -f 1 "sums/uji-$1.tar.gz.sha256"; }
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > tap/Formula/uji.rb <<RUBY
          class Uji < Formula
            desc "Coding agent you can shape with Lua"
            homepage "https://github.com/uji-labs/uji"
            license "GPL-3.0-or-later"

            head do
              url "https://github.com/uji-labs/uji.git", branch: "main"
              depends_on "rust" => :build
            end

            on_macos do
              depends_on arch: :arm64

              on_arm do
                url "${base}/uji-aarch64-apple-darwin.tar.gz"
                sha256 "$(sum aarch64-apple-darwin)"
              end
            end

            on_linux do
              on_intel do
                url "${base}/uji-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sum x86_64-unknown-linux-gnu)"
              end

              on_arm do
                url "${base}/uji-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sum aarch64-unknown-linux-gnu)"
              end
            end

            def install
              if build.head?
                system "cargo", "install", *std_cargo_args(path: "crates/uji")
              else
                bin.install "uji"
              end
            end

            test do
              assert_match(/^uji \d+\.\d+\.\d+$/, shell_output("#{bin}/uji --version"))
            end
          end
          RUBY

      - name: Open a pull request on the tap
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          TAG: ${{ github.ref_name }}
        working-directory: tap
        run: |
          version="${TAG#v}"
          branch="uji-${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "uji ${version}"
          git push origin "$branch"
          gh pr create --repo uji-labs/homebrew-uji --base main --head "$branch" \
            --title "uji ${version}" --body "Moves the formula to [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})."

  copr:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: uji-labs/copr
          ref: master
          token: ${{ secrets.PACKAGE_TOKEN }}
          path: packaging
      - name: Open a packaging pull request
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'COPR packaging requires a stable vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          }
          version="${TAG#v}"
          branch="uji-${version}"
          existing=$(gh pr list --repo uji-labs/copr --head "$branch" --state all --json url --jq '.[0].url // empty')
          if [[ -n "$existing" ]]; then
            echo "A packaging pull request already exists: $existing"
            exit 0
          fi
          remote=$(git -C packaging ls-remote --heads origin "$branch")
          if [[ -n "$remote" ]]; then
            git -C packaging fetch origin "$branch"
            git -C packaging switch -c "$branch" FETCH_HEAD
          else
            git -C packaging switch -c "$branch"
          fi
          COMMIT=$(git -C source rev-parse HEAD)
          export COMMIT
          python3 <<'PY'
          import datetime
          import os
          import re
          from pathlib import Path

          path = Path("packaging/uji.spec")
          spec = path.read_text()
          version = os.environ["TAG"][1:]
          commit = os.environ["COMMIT"]
          if re.search(rf"^Version:\s+{re.escape(version)}$", spec, re.M) and spec.startswith(f"%global commit {commit}\n"):
              raise SystemExit(0)
          for pattern, replacement in (
              (r"^%global commit .+$", f"%global commit {commit}"),
              (r"^Version:.*$", f"Version:        {version}"),
              (r"^Release:.*$", "Release:        1%{?dist}"),
          ):
              spec, count = re.subn(pattern, replacement, spec, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Missing spec field: {pattern}")
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%a %b %d %Y")
          entry = f"* {date} github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com> - {version}-1\n- Update to {os.environ['TAG']}.\n\n"
          if spec.count("%changelog\n") != 1:
              raise SystemExit("The spec must contain one changelog.")
          path.write_text(spec.replace("%changelog\n", "%changelog\n" + entry, 1))
          PY
          cd packaging
          if git diff --quiet -- uji.spec; then
            echo 'The spec already points to this release.'
            [[ -n "$remote" ]] || exit 0
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uji.spec
            git commit -m "copr: Update uji to ${version}"
            git push origin "$branch"
          fi
          gh pr create --repo uji-labs/copr --base master --head "$branch" \
            --title "copr: Update uji to ${version}" \
            --body "Updates the pinned source to [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}). Review dependency licenses before merging. Merging starts COPR publication after Fedora checks pass."
