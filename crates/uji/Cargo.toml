[package]
name = "uji"
version.workspace = true
edition.workspace = true

[dependencies]
uji-api = { path = "../api" }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
ratatui = "0.30"
crossterm = "0.29"
calloop = "0.14.4"
thiserror = "2"
diesel = { version = "2.3", features = ["sqlite"] }
diesel_migrations = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "time"] }
futures-util = "0.3"
async-trait = "0.1"
keyring = "4"
uuid = { version = "1", features = ["v7", "serde"] }
regex = "1"
globset = "0.4"

[lints]
workspace = true
