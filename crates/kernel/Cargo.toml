[package]
name = "uji-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Lua runtime and operating system primitives uji is built on"

[dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
calloop = { version = "0.14.4", features = ["executor"] }
crossterm = "0.29"
futures-util = "0.3"
globset = "0.4"
keyring = "4"
mlua = { version = "0.12", features = ["luajit52", "vendored", "serialize", "async"] }
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
rand = "0.9"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.12", features = ["stream"] }
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "net", "io-util", "sync", "fs", "macros"] }
unicode-width = "0.2"

[lints]
workspace = true
