[package]
name = "uji-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Lua runtime and operating system primitives uji is built on"

[dependencies]
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
futures-util = "0.3"
glob = "0.3.4"
globset = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ito = { git = "https://github.com/uji-labs/ito", branch = "main" }
keyring = "4"
linkme = "0.3"
mlua = { version = "0.12", features = ["luajit52", "vendored", "serde", "async"] }
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "system-proxy"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = { version = "3.2.0", features = ["inline", "unicode"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "net", "io-util", "sync", "fs", "macros", "signal"] }
toml = "1"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2"
uji-macros = { path = "../macros" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }

[lints]
workspace = true
