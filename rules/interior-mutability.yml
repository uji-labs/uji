id: interior-mutability
language: rust
severity: error
message: >-
  `RefCell` and `Cell` belong where state is shared by owners that cannot hold
  `&mut`: the kernel's `Promise`, which several tasks await while another
  resolves it. Anywhere else the type is plain data mutated through `&mut self`,
  and whoever shares it wraps it as `RefCell<T>`. With `&mut` in hand, use
  `get_mut()` rather than `borrow_mut()`.
ignores:
  - "crates/kernel/src/promise.rs"
rule:
  kind: field_declaration
  has:
    field: type
    regex: "^(RefCell|Cell)<"
