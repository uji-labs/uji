id: shared-ownership
language: rust
severity: error
message: >-
  `Rc` is for a value with several owners whose lifetimes cannot be written
  down. A value with one owner is owned directly, or boxed when it is a trait
  object. Clone an `Rc` only where a new owner is created, never to pass a
  value down a call.
rule:
  any:
    - kind: field_declaration
      has:
        field: type
        regex: "^Rc<"
    - kind: type_item
      has:
        field: type
        regex: "^Rc<"
